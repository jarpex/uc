name: Update the Homebrew Formula

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  update-formula:
    name: Update the formula
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the tap
        uses: actions/checkout@v4
        with:
          repository: jarpex/homebrew-formulae
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: tap

      - name: Checkout the sources
        uses: actions/checkout@v4

      - name: Download the release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION=${TAG#v}
          NAME="uc-$VERSION.tar.gz"
          for attempt in 1 2 3 4 5 6; do
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir .; then
              break
            fi
            if [ "$attempt" = 6 ]; then
              echo "the release has no asset named $NAME" >&2
              exit 1
            fi
            echo "the asset is not there yet, retrying" >&2
            sleep 10
          done
          sha256sum "$NAME"

      - name: Update the formula
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION=${TAG#v}
          NAME="uc-$VERSION.tar.gz"
          SHA256=$(sha256sum "$NAME" | cut -d' ' -f1)
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$NAME"
          python3 scripts/update-formula.py \
            tap/Formula/uc.rb "$URL" "$VERSION" "$SHA256"

      - name: Check the formula
        working-directory: tap
        run: brew style Formula/uc.rb

      - name: Commit and push
        env:
          TAG: ${{ github.event.release.tag_name }}
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/uc.rb
          if git diff --cached --quiet; then
            echo "the formula is already up to date" >&2
            exit 0
          fi
          git commit -m "chore: update uc to $TAG"
          git push
