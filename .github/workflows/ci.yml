name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Strict compile
        run: cc -std=c99 -Wall -Wextra -Wpedantic -Wshadow -Wconversion -O2 -I. -c uc.c -o /dev/null

      - name: Install
        run: make install PREFIX="$PWD/stage"

      - name: Check the installed binary
        run: |
          stage/bin/uc --version
          stage/bin/uc --help
          grep -q "show or clean Unicode artifacts" stage/share/man/man1/uc.1

  homebrew:
    name: Homebrew formula
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Homebrew
        id: brew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      - name: Tap the formula
        run: |
          brew tap jarpex/formulae https://github.com/jarpex/homebrew-formulae.git
          brew tap-info

      - name: Install the released version
        run: brew install jarpex/formulae/uc

      - name: Check the installed binary
        run: |
          uc --version
          uc --help
