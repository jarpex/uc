name: Probe

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      probe:
        description: probe
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "event fired"
          echo "tag: ${{ github.event.release.tag_name || 'dispatch' }}"
